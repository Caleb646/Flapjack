syntax = "proto3";

/*
 * HIL simulator link contract (shared by FC nanopb + PC python).
 *
 * Direction is noted per message.
 *
 * SensorData stands in for the parts on the board, so it carries what those
 * parts report, NOT what the FC ultimately consumes. Two things follow, and
 * devices/imu.c undoes both for hardware and sim alike:
 *
 *   - Frame: each vector is in its own sensor's DIE frame, not the body frame.
 *     A part has no knowledge of FRD. The FC rotates by IMU_ALIGN / MAG_ALIGN
 *     (target header) to reach body FRD, which is what puts common/align.c on
 *     the SIL's critical path rather than leaving it untested in the loop.
 *   - Sign: the accelerometer carries specific force as measured, a - g, so
 *     level & still is (0, 0, -9.81) in BODY frame - gravity points down, and
 *     down is +z in FRD. The FC's own up-positive convention (+9.81) is applied
 *     on top of that.
 *
 * Telemetry below is the other direction and is unaffected: it is estimator
 * output, already in NED.
 *
 * This block used to say vectors were body FRD, and to say (a - g) while giving
 * +9.81 - opposite signs. The formula was right; the example was the FC-side
 * convention.
 * 
 * Frame msg_id bytes: SensorData=1, ServoCmd=3, MotorCmd=4, Telemetry=5,
 * BaroData=7 (see drivers/sim_link/sim_link.h). 2 is retired - it carried
 * RcInput, which wrote g_Rx.channels directly and bypassed the receiver driver;
 * RC now reaches the FC as real CRSF frames on the RX UART. Do not reuse the id.
 *
 * GPS is deliberately absent from this file. It arrives as real NMEA on the
 * GPS UART for the same reason RC arrives as real CRSF: a frame here would
 * bypass the byte assembler, minmea and Gps_Update_ entirely.
 */

// PC -> FC: synthesized sensor sample.
message SensorData {
    repeated float accel = 1;  // m/s^2, specific force (a - g), IMU die frame
    repeated float gyro  = 2;  // deg/s, IMU die frame
    repeated float mag   = 3;  // normalized field, MAG die frame
}

/*
 * PC -> FC: barometer sample, on its OWN frame rather than folded into
 * SensorData. A baro is a 10-50 Hz part; riding the 400 Hz IMU frame would
 * either pace Baro_Task at 400 Hz or force an artificial decimation on the FC,
 * and it removes the very rate mismatch a nav filter has to cope with.
 */
message BaroData {
    float pressure_pa    = 1;  // static pressure, Pa
    float temperature_c  = 2;  // degrees C
}

// FC -> PC: servo (tilt) command, one angle per servo.
message ServoCmd {
    repeated float angle = 1;  // radians, per servo
}

// FC -> PC: motor command, one throttle per motor.
message MotorCmd {
    repeated float throttle = 1;  // 0.0 - 1.0, per motor
}

/*
 * FC -> PC: telemetry for open-loop validation.
 *
 * The baro_* and gps_* fields are a deliberate LOOPBACK, not an estimate: the
 * FC echoes back the sensor value it decoded, so the bridge can assert that
 * what it sent is what the firmware understood. That round trip is the whole
 * acceptance test for the sensor path - it covers the frame/UART, the driver,
 * the device and the umsg publish in one comparison, and it is exactly the
 * check that catches a parser which succeeds while discarding its result.
 *
 * The *_count fields are the pacing metric, same role as imu_count: they should
 * track frames/sentences sent 1:1, and a shortfall means samples are being
 * dropped rather than mis-decoded.
 */
message Telemetry {
    repeated float euler = 1;       // deg [roll, pitch, yaw] from nav
    bool   armed         = 2;
    uint32 imu_count     = 3;       // increments per consumed IMU sample (pacing check)
    bool   rc_link_up    = 4;       // CRSF frames still arriving (Rx_IsLinkUp)

    float  baro_pa       = 5;       // last pressure decoded from BaroData, Pa
    uint32 baro_count    = 6;       // BaroData frames consumed by the baro driver

    double gps_lat       = 7;       // last fix decoded from NMEA, degrees
    double gps_lon       = 8;
    float  gps_alt       = 9;       // metres MSL
    uint32 gps_sats      = 10;
    uint32 gps_count     = 11;      // GPS publishes consumed (NMEA sentences decoded)

    /*
     * The nav_* fields are the ESTIMATOR OUTPUT, and are the opposite of a
     * loopback: nothing here was sent by the bridge. They are what the FC
     * worked out from the baro and GPS it was fed, so the bridge can compare
     * them against the FDM's own truth and gate on the difference.
     *
     * Straight from umsg_nav_state_t, so NED and down-positive - altitude is
     * -nav_pos_ned[2] and climb rate is -nav_vel_ned[2]. Carried once rather
     * than duplicated into scalar alt/vz fields, which would only cost payload
     * and invite the two copies to disagree.
     *
     * nav_valid is the NAV_VALID_* bitmask and is what makes the rest
     * interpretable: it separates "the estimate says 0 m" from "there is no
     * estimate yet", and asserting against an unpopulated field is exactly how
     * a green gate comes to mean nothing.
     */
    repeated float nav_pos_ned = 12;   // metres, NED (down positive)
    repeated float nav_vel_ned = 13;   // metres/second, NED (down positive)
    uint32 nav_valid           = 14;   // NAV_VALID_* bitmask from nav.json
}
