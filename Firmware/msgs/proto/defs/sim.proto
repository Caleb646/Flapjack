syntax = "proto3";

/*
 * HIL simulator link contract (shared by FC nanopb + PC python).
 *
 * This file is now ONE DIRECTION ONLY: FC -> PC. Every inbound message has been
 * retired, because each of them injected a decoded value past the code that was
 * supposed to produce it:
 *
 *   - SensorData (accel, gyro, mag) and BaroData (Pa, degC) fed sim driver
 *     backends directly. All three parts are emulated in Renode now
 *     (Scripts/renode/{BMI323,MMC5983,BMP390}.cs); the bridge pushes physical
 *     values into those models over their own sockets, and the firmware reads
 *     them back through the real drivers over emulated SPI. That puts the
 *     register maps, the chip selects, common/align.c and the barometer's
 *     21-byte calibration decode and compensation polynomial on the critical
 *     path instead of stepping over all of it.
 *   - RcInput wrote g_Rx.channels directly, bypassing the CRSF driver. RC is
 *     real CRSF on the RX UART now.
 *   - GPS was never given a frame here, for the same reason: it arrives as real
 *     NMEA on the GPS UART, so the byte assembler, minmea and Gps_Update_ all
 *     run for real.
 *
 * Frame msg_id bytes: ServoCmd=3, MotorCmd=4, Telemetry=5 (see
 * drivers/sim_link/sim_link.h). 1 (SensorData), 2 (RcInput) and 7 (BaroData)
 * are retired - do not reuse them. An older bridge on the other end of the wire
 * would still be sending them, and they would decode as whatever took the id.
 */

// FC -> PC: servo (tilt) command, one angle per servo.
message ServoCmd {
    repeated float angle = 1;  // radians, per servo
}

// FC -> PC: motor command, one throttle per motor.
message MotorCmd {
    repeated float throttle = 1;  // 0.0 - 1.0, per motor
}

/*
 * FC -> PC: telemetry for open-loop validation.
 *
 * The baro_* and gps_* fields are a deliberate LOOPBACK, not an estimate: the
 * FC echoes back the sensor value it recovered, so the bridge can assert that
 * what it sent is what the firmware understood. That round trip is the whole
 * acceptance test for the sensor path - it covers the wire, the driver, the
 * device and the umsg publish in one comparison, and it is exactly the check
 * that catches a parser which succeeds while discarding its result.
 *
 * baro_pa is no longer bit-exact against what was sent, and must not be
 * compared as though it were. It is a physical value that went into an emulated
 * BMP390 as a 24-bit ADC count and came back through the driver's float32
 * compensation polynomial, so the bridge compares it within a tolerance.
 * Measured round-trip error over -20..60 C and 50..115 kPa is 0.016 Pa, which
 * is float32 rounding rather than quantisation - so the tolerance stays far
 * tighter than any real decode error would be.
 *
 * The *_count fields are the pacing metric, same role as imu_count: they should
 * track what the bridge pushed 1:1, and a shortfall means samples are being
 * dropped rather than mis-decoded.
 */
message Telemetry {
    repeated float euler = 1;       // deg [roll, pitch, yaw] from nav
    bool   armed         = 2;
    uint32 imu_count     = 3;       // IMU samples read off the part and published (pacing check)
    bool   rc_link_up    = 4;       // CRSF frames still arriving (Rx_IsLinkUp)

    float  baro_pa       = 5;       // last pressure the baro driver compensated, Pa
    uint32 baro_count    = 6;       // samples consumed by the baro driver

    double gps_lat       = 7;       // last fix decoded from NMEA, degrees
    double gps_lon       = 8;
    float  gps_alt       = 9;       // metres MSL
    uint32 gps_sats      = 10;
    uint32 gps_count     = 11;      // GPS publishes consumed (NMEA sentences decoded)

    /*
     * The nav_* fields are the ESTIMATOR OUTPUT, and are the opposite of a
     * loopback: nothing here was sent by the bridge. They are what the FC
     * worked out from the baro and GPS it was fed, so the bridge can compare
     * them against the FDM's own truth and gate on the difference.
     *
     * Straight from umsg_nav_state_t, so NED and down-positive - altitude is
     * -nav_pos_ned[2] and climb rate is -nav_vel_ned[2]. Carried once rather
     * than duplicated into scalar alt/vz fields, which would only cost payload
     * and invite the two copies to disagree.
     *
     * nav_valid is the NAV_VALID_* bitmask and is what makes the rest
     * interpretable: it separates "the estimate says 0 m" from "there is no
     * estimate yet", and asserting against an unpopulated field is exactly how
     * a green gate comes to mean nothing.
     */
    repeated float nav_pos_ned = 12;   // metres, NED (down positive)
    repeated float nav_vel_ned = 13;   // metres/second, NED (down positive)
    uint32 nav_valid           = 14;   // NAV_VALID_* bitmask from nav.json
}
