# Altitude hold: take off on the throttle stick, hold height, walk the target.
#
# There is one flight mode and it is always active (tasks/mission/mission.c), so
# there is nothing to engage - the throttle stick commands a CLIMB RATE from the
# moment the vehicle arms, and centred means "hold", not 50% power.
#
# THE TAKEOFF IS THE POINT, and it is why the stick goes to 2000 rather than
# somewhere sensible-looking. Full stick is only
# CFG_ALT_HOLD_CLIMB_RATE_MPS (1.0 m/s), so a shorter or gentler climb leaves
# the vehicle sitting on its gear "holding altitude" at zero, which tests none
# of this. 1500 us in particular does nothing at all: it is the centre of the
# climb-rate deadband.
name: alt_hold
plan:
  - {t: 0.0,  dur: 3.0}                        # settle at idle after arming
  - {t: 3.0,  dur: 8.0,  set: {throttle: 2000}}  # climb at 1 m/s
  - {t: 11.0, dur: 8.0,  set: {throttle: 1500}}  # centre: hold the height reached
  - {t: 19.0, dur: 4.0,  set: {throttle: 1800}}  # walk the target up (~0.6 m/s)
  - {t: 23.0, dur: 9.0,  set: {throttle: 1500}}  # centre: hold the new altitude
