source [find interface/stlink.cfg]
transport select swd

set DUAL_BANK 1
set DUAL_CORE 1

source [find target/stm32h7x_dual_bank.cfg]

adapter speed 1000

# connect_assert_srst: forces to connect under reset
reset_config srst_only srst_nogate connect_assert_srst

targets stm32h7x.cpu0  # M7 core
targets stm32h7x.cpu1  # M4 core