source [find interface/stlink.cfg]
transport select hla_swd

set DUAL_BANK 1
set DUAL_CORE 1

source [find target/stm32h7x_dual_bank.cfg]

adapter speed 1000

# No reset_config srst_only here: on flapjack-v1 (STLINK-V3, HLA driver) the H7
# core debug regs are unreachable while SRST is held, so the halt-on-reset
# request is lost and "reset init" times out. The stock SYSRESETREQ reset from
# stm32h7x.cfg works. Boards that need connect-under-reset add it in their own
# cfg, which sources this one (see nucleo_h747zi.cfg).

targets stm32h7x.cpu0  # M7 core
targets stm32h7x.cpu1  # M4 core